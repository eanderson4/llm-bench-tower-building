<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tower bench — leaderboard</title>
    <style>
      body { margin: 0; background: #101418; color: #dfe6ee; font-family: ui-monospace, monospace; font-size: 14px; }
      main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .sub { color: #8b98a5; margin-bottom: 18px; }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
      .chip { background: #232a33; border: 1px solid #3a4450; border-radius: 999px; padding: 3px 12px; cursor: pointer; color: #dfe6ee; font: inherit; }
      .chip.active { background: #3d5a99; border-color: #5a7bc0; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #232a33; white-space: nowrap; }
      th { color: #8b98a5; cursor: pointer; user-select: none; }
      th:hover { color: #dfe6ee; }
      tr.best td { color: #ffd97a; }
      a { color: #6fa8dc; }
      td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .err { color: #ff9c9c; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tower bench — leaderboard</h1>
      <div class="sub" id="meta">loading…</div>
      <div class="chips" id="chips"></div>
      <div id="table"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
